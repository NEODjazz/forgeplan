name: Native platform checks and candidates
on: [push, pull_request, workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  platforms:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('packaging/platforms.json').read_text())['platforms']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('value=' + json.dumps({'include': rows}) + '\n')
          PY
  native:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: python tests/http_smoke.py
      - run: python tests/workspace_smoke.py
      - run: python tests/platform_smoke.py
      - if: runner.os == 'Linux'
        run: python tests/oidc_smoke.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev pkg-config xvfb xdotool
      - run: cargo clippy --features native-client --all-targets --locked -- -D warnings
      - run: cargo test --features native-client --locked
      - run: cargo build --release --features native-client --locked
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python tests/native_e2e.py
      - if: runner.os != 'Windows'
        run: python scripts/package-release.py --platform ${{ matrix.id }} --binary target/release/forgeplan
      - if: runner.os == 'Windows'
        run: python scripts/package-release.py --platform ${{ matrix.id }} --binary target/release/forgeplan.exe
      - uses: actions/upload-artifact@v4
        with:
          name: forgeplan-${{ matrix.id }}-candidate
          path: |
            dist/ForgePlan-*
          if-no-files-found: error
